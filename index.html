<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Supabase</title>
    <!-- Tailwind CSS para diseño rápido y moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SDK de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #0E0E0E; color: #E5E7EB; }
        .card { background-color: #121212; border: 1px solid #1F2937; }
    </style>
</head>
<body class="p-6">

    <div class="max-w-7xl mx-auto">
        <header class="flex justify-between items-center mb-8 border-b border-gray-800 pb-4">
            <div>
                <h1 class="text-2xl font-bold text-white">Panel de Control & Consulta</h1>
                <p class="text-sm text-gray-400">Monitoreo de datos en tiempo real (Modo Lectura)</p>
            </div>
            <div id="status-conexion" class="text-xs px-3 py-1 rounded bg-yellow-900 text-yellow-200">Conectando...</div>
        </header>

        <!-- Pestañas de Navegación -->
        <div class="flex space-x-2 mb-6 overflow-x-auto pb-2">
            <button onclick="cargarDatos('usuarios')" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium rounded transition">Usuarios</button>
            <button onclick="cargarDatos('conductores')" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-white text-sm font-medium rounded transition">Conductores</button>
            <button onclick="cargarDatos('vehiculos')" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-white text-sm font-medium rounded transition">Vehículos</button>
            <button onclick="cargarDatos('viajes')" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-white text-sm font-medium rounded transition">Viajes</button>
            <button onclick="cargarDatos('documentos_conductor')" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-white text-sm font-medium rounded transition">Documentos</button>
            <button onclick="cargarDatos('comercios')" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-white text-sm font-medium rounded transition">Comercios</button>
        </div>

        <!-- Contenedor de la Tabla -->
        <div class="card rounded-xl shadow-lg overflow-hidden">
            <div class="p-4 border-b border-gray-800 flex justify-between items-center">
                <h2 id="titulo-tabla" class="text-lg font-semibold text-white">Selecciona una sección</h2>
                <span id="contador-registros" class="text-xs text-gray-400">0 registros</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse" id="tabla-datos">
                    <!-- Los datos se inyectarán aquí dinámicamente -->
                </table>
            </div>
        </div>
    </div>

    <script>
        // Configuración de Supabase con tus credenciales
        const SUPABASE_URL = 'https://idswjzbrpneordatkqan.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlkc3dqemJycG5lb3JkYXRrcWFuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3OTM2MjMsImV4cCI6MjEwNDM2OTYyM30.GmPqlWn3_EZTy23Oziw_N4DuoKDVAhqr6YHnlKBB2Gw';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Verificar conexión al cargar
        async function probarConexion() {
            const badge = document.getElementById('status-conexion');
            try {
                const { data, error } = await supabaseClient.from('usuarios').select('id').limit(1);
                if (error) throw error;
                badge.textContent = 'Conectado (Lectura)';
                badge.className = 'text-xs px-3 py-1 rounded bg-green-900 text-green-200';
                cargarDatos('usuarios'); // Cargar usuarios por defecto
            } catch (err) {
                badge.textContent = 'Error de conexión';
                badge.className = 'text-xs px-3 py-1 rounded bg-red-900 text-red-200';
                console.error(err);
            }
        }

        // Función genérica para consultar cualquier tabla sin modificar
        async function cargarDatos(tabla) {
            document.getElementById('titulo-tabla').textContent = `Tabla: ${tabla.toUpperCase()}`;
            const tablaHTML = document.getElementById('tabla-datos');
            tablaHTML.innerHTML = `<tr><td class="p-4 text-center text-gray-400">Cargando datos...</td></tr>`;

            try {
                const { data, error, count } = await supabaseClient
                    .from(tabla)
                    .select('*', { count: 'exact' })
                    .limit(50); // Traemos los últimos 50 registros por seguridad

                if (error) throw error;

                document.getElementById('contador-registros').textContent = `${data.length} registros mostrados`;

                if (data.length === 0) {
                    tablaHTML.innerHTML = `<tr><td class="p-4 text-center text-gray-400">No hay registros en esta tabla.</td></tr>`;
                    return;
                }

                // Generar columnas de la tabla dinámicamente
                const columnas = Object.keys(data[0]);
                
                let htmlHeader = '<tr class="bg-gray-900 border-b border-gray-800 text-xs text-gray-400 uppercase">';
                columnas.forEach(col => {
                    htmlHeader += `<th class="p-3">${col}</th>`;
                });
                htmlHeader += '</tr>';

                let htmlBody = '';
                data.forEach(row => {
                    htmlBody += '<tr class="border-b border-gray-800/50 hover:bg-gray-900/40 text-sm">';
                    columnas.forEach(col => {
                        let valor = row[col];
                        // Si es un enlace URL (como tus fotos o documentos), mostrar enlace amigable
                        if (typeof valor === 'string' && (valor.startsWith('http://') || valor.startsWith('https://'))) {
                            valor = `<a href="${valor}" target="_blank" class="text-blue-400 underline truncate max-w-xs block">Ver archivo</a>`;
                        } else if (valor === null) {
                            valor = '<span class="text-gray-600 italic">null</span>';
                        }
                        htmlBody += `<td class="p-3 truncate max-w-xs">${valor}</td>`;
                    });
                    htmlBody += '</tr>';
                });

    <main class="max-w-7xl mx-auto">
        <!-- Contenido principal -->
    </main>

                tablaHTML.innerHTML = htmlHeader + htmlBody;

            } catch (err) {
                tablaHTML.innerHTML = `<tr><td class="p-4 text-center text-red-400">Error al consultar: ${err.message}</td></tr>`;
            }
        }

        probarConexion();
    </script>
</body>
</html>
