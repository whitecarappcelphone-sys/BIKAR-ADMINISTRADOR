<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Supabase</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SDK de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #0E0E0E; color: #E5E7EB; }
        .card { background-color: #121212; border: 1px solid #1F2937; }
    </style>
</head>
<body class="p-6">

    <div class="max-w-7xl mx-auto">
        <header class="flex justify-between items-center mb-8 border-b border-gray-800 pb-4">
            <div>
                <h1 class="text-2xl font-bold text-white">Panel de Control & Consulta</h1>
                <p class="text-sm text-gray-400">Monitoreo detallado de viajes, documentos y registros</p>
            </div>
            <div id="status-conexion" class="text-xs px-3 py-1 rounded bg-yellow-900 text-yellow-200">Conectando...</div>
        </header>

        <!-- Pestañas de Navegación -->
        <div class="flex space-x-2 mb-6 overflow-x-auto pb-2">
            <button onclick="cambiarTabla('usuarios')" id="btn-usuarios" class="px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded transition">Usuarios</button>
            <button onclick="cambiarTabla('conductores')" id="btn-conductores" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-white text-sm font-medium rounded transition">Conductores</button>
            <button onclick="cambiarTabla('vehiculos')" id="btn-vehiculos" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-white text-sm font-medium rounded transition">Vehículos</button>
            <button onclick="cambiarTabla('viajes')" id="btn-viajes" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-white text-sm font-medium rounded transition">Viajes</button>
            <button onclick="cambiarTabla('documentos_conductor')" id="btn-documentos_conductor" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-white text-sm font-medium rounded transition">Documentos</button>
            <button onclick="cambiarTabla('comercios')" id="btn-comercios" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-white text-sm font-medium rounded transition">Comercios</button>
        </div>

        <!-- Tarjetas de Resumen Rápido -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div class="card p-4 rounded-xl flex flex-col justify-between">
                <span class="text-xs text-gray-400 uppercase font-semibold">Registros Visibles</span>
                <span id="stat-total" class="text-2xl font-bold text-white mt-1">0</span>
            </div>
            <div class="card p-4 rounded-xl flex flex-col justify-between" id="card-secundaria">
                <span class="text-xs text-gray-400 uppercase font-semibold" id="label-secundario">Métrica Adicional</span>
                <span id="stat-secundario" class="text-2xl font-bold text-white mt-1">-</span>
            </div>
            <div class="card p-4 rounded-xl flex flex-col justify-between">
                <span class="text-xs text-gray-400 uppercase font-semibold">Estado de Lectura</span>
                <span class="text-xs font-medium text-green-400 mt-2 bg-green-950/50 border border-green-800/50 px-2.5 py-1 rounded w-fit">🔒 Seguro (Solo Lectura)</span>
            </div>
        </div>

        <!-- Barra de Búsqueda y Filtros -->
        <div class="mb-4 flex gap-4 items-center">
            <input type="text" id="input-buscar" placeholder="Filtrar por DNI, placa, ID, tarifa..." onkeyup="filtrarTabla()" 
                class="w-full md:w-96 px-4 py-2 bg-[#121212] border border-gray-800 rounded-lg text-sm text-white focus:outline-none focus:border-blue-500">
            <span id="contador-registros" class="text-xs text-gray-400 whitespace-nowrap">0 registros</span>
        </div>

        <!-- Contenedor de la Tabla -->
        <div class="card rounded-xl shadow-lg overflow-hidden">
            <div class="p-4 border-b border-gray-800">
                <h2 id="titulo-tabla" class="text-lg font-semibold text-white">Selecciona una sección</h2>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse" id="tabla-datos">
                    <!-- Los datos se inyectarán aquí -->
                </table>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://idswjzbrpneordatkqan.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlkc3dqemJycG5lb3JkYXRrcWFuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3OTM2MjMsImV4cCI6MjEwNDM2OTYyM30.GmPqlWn3_EZTy23Oziw_N4DuoKDVAhqr6YHnlKBB2Gw';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let tablaActual = 'usuarios';
        let datosOriginales = [];

        async function probarConexion() {
            const badge = document.getElementById('status-conexion');
            try {
                const { error } = await supabaseClient.from('usuarios').select('id').limit(1);
                if (error) throw error;
                badge.textContent = 'Conectado (Lectura)';
                badge.className = 'text-xs px-3 py-1 rounded bg-green-900 text-green-200';
                cargarDatos('usuarios');
            } catch (err) {
                badge.textContent = 'Error de conexión';
                badge.className = 'text-xs px-3 py-1 rounded bg-red-900 text-red-200';
                console.error(err);
            }
        }

        function cambiarTabla(tabla) {
            tablaActual = tabla;
            document.querySelectorAll('.flex.space-x-2 button').forEach(btn => {
                btn.className = "px-4 py-2 bg-gray-800 hover:bg-gray-700 text-white text-sm font-medium rounded transition";
            });
            document.getElementById(`btn-${tabla}`).className = "px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded transition";
            document.getElementById('input-buscar').value = '';
            cargarDatos(tabla);
        }

        async function cargarDatos(tabla) {
            document.getElementById('titulo-tabla').textContent = `Tabla: ${tabla.toUpperCase()}`;
            const tablaHTML = document.getElementById('tabla-datos');
            tablaHTML.innerHTML = `<tr><td class="p-4 text-center text-gray-400">Cargando datos...</td></tr>`;

            try {
                let query = supabaseClient.from(tabla).select('*').limit(150);
                
                const { data, error } = await query;
                if (error) throw error;

                datosOriginales = data;
                renderizarTabla(data);

            } catch (err) {
                tablaHTML.innerHTML = `<tr><td class="p-4 text-center text-red-400">Error al consultar: ${err.message}</td></tr>`;
            }
        }

        function renderizarTabla(data) {
            const tablaHTML = document.getElementById('tabla-datos');
            document.getElementById('contador-registros').textContent = `${data.length} registros`;
            document.getElementById('stat-total').textContent = data.length;

            // Calcular métrica secundaria según la tabla
            const labelSecundario = document.getElementById('label-secundario');
            const statSecundario = document.getElementById('stat-secundario');

            if (tablaActual === 'viajes') {
                labelSecundario.textContent = 'Recaudo Total (Filtrado)';
                const totalTarifa = data.reduce((acc, row) => acc + (Number(row.tarifa) || 0), 0);
                statSecundario.textContent = `$${totalTarifa.toFixed(2)}`;
                statSecundario.className = "text-2xl font-bold text-green-400 mt-1";
            } else if (tablaActual === 'conductores') {
                labelSecundario.textContent = 'Conductores Activos';
                const activos = data.filter(row => row.conductor_activo === true || row.disponible === true).length;
                statSecundario.textContent = activos;
                statSecundario.className = "text-2xl font-bold text-blue-400 mt-1";
            } else {
                labelSecundario.textContent = 'Sección Activa';
                statSecundario.textContent = tablaActual.toUpperCase();
                statSecundario.className = "text-2xl font-bold text-white mt-1";
            }

            if (data.length === 0) {
                tablaHTML.innerHTML = `<tr><td class="p-4 text-center text-gray-400">No hay registros en esta tabla.</td></tr>`;
                return;
            }

            const columnas = Object.keys(data[0]);
            
            let htmlHeader = '<tr class="bg-gray-900 border-b border-gray-800 text-xs text-gray-400 uppercase">';
            columnas.forEach(col => {
                htmlHeader += `<th class="p-3">${col}</th>`;
            });
            htmlHeader += '</tr>';

            let htmlBody = '';
            data.forEach(row => {
                htmlBody += '<tr class="border-b border-gray-800/50 hover:bg-gray-900/40 text-sm">';
                columnas.forEach(col => {
                    let valor = row[col];
                    
                    if (typeof valor === 'string' && (valor.startsWith('http://') || valor.startsWith('https://'))) {
                        valor = `<a href="${valor}" target="_blank" class="inline-block px-2.5 py-1 bg-blue-900/50 text-blue-300 rounded border border-blue-800 hover:bg-blue-900 text-xs font-medium">📄 Ver Archivo</a>`;
                    } 
                    else if (col.includes('tarifa') && valor !== null) {
                        valor = `<span class="text-green-400 font-semibold">$${Number(valor).toFixed(2)}</span>`;
                    }
                    else if (valor === null) {
                        valor = '<span class="text-gray-600 italic">null</span>';
                    }
                    
                    htmlBody += `<td class="p-3 truncate max-w-xs">${valor}</td>`;
                });
                htmlBody += '</tr>';
            });

            tablaHTML.innerHTML = htmlHeader + htmlBody;
        }

        function filtrarTabla() {
            const texto = document.getElementById('input-buscar').value.toLowerCase();
            const filtrados = datosOriginales.filter(row => {
                return Object.values(row).some(val => 
                    String(val).toLowerCase().includes(texto)
                );
            });
            renderizarTabla(filtrados);
        }

        probarConexion();
    </script>
</body>
</html>
